<div class="cart-action-buttons-group">
	{% if cart_settings.enable_checkout %}
		<button class="btn btn-primary btn-place-order" type="button">
			{{ _("Checkout") }}
		</button>
		<button class="btn btn-outline-secondary btn-request-for-quotation" type="button">
			{{ _("Request Quote") }}
		</button>
		<button class="btn btn-outline-secondary btn-export-csv" type="button">
			{{ _("Export Cart (.csv)") }}
		</button>
		<button class="btn btn-outline-secondary btn-empty-cart" type="button">
			{{ _("Empty Cart") }}
		</button>
	{% else %}
		<button class="btn btn-primary btn-request-for-quotation" type="button">
			{{ _("Request Quote") }}
		</button>
		<button class="btn btn-outline-secondary btn-export-csv" type="button">
			{{ _("Export Cart (.csv)") }}
		</button>
		<button class="btn btn-outline-secondary btn-empty-cart" type="button">
			{{ _("Empty Cart") }}
		</button>
	{% endif %}
</div>
